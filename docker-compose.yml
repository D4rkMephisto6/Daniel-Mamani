version: '3.8'
services:
  oracle-db:
    image: gvenzl/oracle-xe:21-slim-faststart
    container_name: pharmasoft-oracle
    environment:
      - ORACLE_PASSWORD=${ORACLE_PASSWORD:?Set ORACLE_PASSWORD in .env}
      - APP_USER=PHARMADB
      - APP_USER_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "1522:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
volumes:
  oracle-data:
